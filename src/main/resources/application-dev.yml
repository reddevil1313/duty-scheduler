# Local development only. bootRun activates this profile; nothing else should.
spring:
  datasource:
    password: ${DATABASE_PASSWORD:duty_local_dev}   # docker-compose.yml's

# Plain http://localhost, so a secure-only cookie would never be sent back.
server:
  servlet:
    session:
      cookie:
        secure: false

# Public dev-only passwords.
dev:
  seed:
    admin-password: ${DEV_ADMIN_PASSWORD:admin}
    trooper-password: ${DEV_TROOPER_PASSWORD:trooper_d}

# Dev owner.
owner:
  bootstrap:
    username: ${OWNER_USERNAME:owner}
    password: ${OWNER_PASSWORD:owner}
