spring:
  application:
    name: duty-scheduler
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/duty}
    username: ${DATABASE_USER:duty}
    password: ${DATABASE_PASSWORD:duty_local_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false # off by default here; it hides N+1 queries behind lazy loads
  flyway:
    enabled: true

# The owner, made at startup if there is none yet; see OwnerBootstrap. Left
# empty, the server starts without one and says so in the log.
owner:
  bootstrap:
    username: ${OWNER_USERNAME:}
    password: ${OWNER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
