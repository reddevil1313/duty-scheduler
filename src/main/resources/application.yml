spring:
  application:
    name: duty-scheduler
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/duty}
    username: ${DATABASE_USER:duty}
    # No default outside the dev profile: a deploy that forgets to set it fails
    # to connect at startup, rather than running on the password in this repo.
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false # off by default here; it hides N+1 queries behind lazy loads
  flyway:
    enabled: true

# The owner, made at startup if there is none yet; see OwnerBootstrap. Left
# empty, the server starts without one and says so in the log.
owner:
  bootstrap:
    username: ${OWNER_USERNAME:}
    password: ${OWNER_PASSWORD:}

server:
  # Client addresses from X-Forwarded-For, trusted only from internal proxy
  # addresses, so the sign-in throttle counts the caller and not the proxy —
  # and someone outside cannot pick their own address with the header.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # HTTPS only, and not sent with requests from other sites. The dev
        # profile turns secure off for plain http://localhost.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Up or down for anyone; which database and how much disk only for the
      # owner, who is the only one let at the rest of the actuator.
      show-details: when-authorized
      roles: OWNER
