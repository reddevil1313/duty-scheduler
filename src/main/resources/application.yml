spring:
  application:
    name: duty-scheduler
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/duty}
    username: ${DATABASE_USER:duty}
    # No default outside dev, so a missing password fails at startup.
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# See OwnerBootstrap. Empty means no owner is created.
owner:
  bootstrap:
    username: ${OWNER_USERNAME:}
    password: ${OWNER_PASSWORD:}

server:
  # Real client address behind a proxy, for the sign-in throttle.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # The dev profile turns secure off.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # Scraped as the owner over HTTP Basic.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Details for the owner only.
      show-details: when-authorized
      roles: OWNER
