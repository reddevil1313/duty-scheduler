name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

  web:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  image:
    name: Image and stack
    needs: [api, web]
    runs-on: ubuntu-latest
    env:
      OWNER_USERNAME: ci-owner
      OWNER_PASSWORD: ci-owner-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: duty-scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Bring the stack up and check it serves.
      - run: docker compose --profile app up -d --no-build
      - name: Wait for the app to report healthy
        run: |
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && exit 0
            sleep 3
          done
          exit 1
      - run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      - if: failure()
        run: docker compose --profile app logs app

  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://duty.sagarsamay.com
    env:
      VM: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same cache as the image job, so this is quick.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: duty-scheduler:latest
          cache-from: type=gha
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy the image and config
        run: |
          docker save duty-scheduler:latest | gzip -1 | ssh "$VM" 'gunzip | docker load'
          scp deploy/compose.yml deploy/Caddyfile deploy/backup.sh "$VM":duty-scheduler/
      - name: Restart
        run: |
          ssh "$VM" 'cd duty-scheduler && docker compose up -d --remove-orphans && docker image prune -f >/dev/null
            for i in $(seq 1 40); do
              [ "$(docker inspect -f "{{.State.Health.Status}}" "$(docker compose ps -q app)")" = healthy ] && exit 0
              sleep 5
            done
            docker compose logs --tail 50 app; exit 1'
      - run: curl -fsS https://duty.sagarsamay.com/actuator/health | grep -q '"status":"UP"'
