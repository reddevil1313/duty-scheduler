# Development: `docker compose up -d db` starts Postgres alone, for bootRun.
#
# The whole stack, built from this repo and run as it would be deployed:
#
#   OWNER_USERNAME=... OWNER_PASSWORD=... DATABASE_PASSWORD=... \
#     docker compose --profile app up -d --build
#
# then http://localhost:8080. The owner is made on first start from the two
# OWNER_ variables. The session cookie is HTTPS-only: browsers allow that on
# localhost, but anywhere else run it behind HTTPS, or set
# SESSION_COOKIE_SECURE=false for a trial over plain HTTP. TZ is the zone the
# sheet image prints its "logged at" time in, such as Etc/GMT-8 for UTC+8.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duty
      # Read only when the volume is first made; changing it later does not
      # change the database's password.
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-duty_local_dev}
      POSTGRES_DB: duty
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [dutydata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duty"]
      interval: 5s
      retries: 10

  app:
    # Only with --profile app, so `docker compose up -d db` stays the dev setup.
    profiles: [app]
    build: .
    image: duty-scheduler
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/duty
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-duty_local_dev}
      OWNER_USERNAME: ${OWNER_USERNAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TZ: ${TZ:-UTC}
    ports: ["${APP_PORT:-8080}:8080"]
    restart: unless-stopped

volumes:
  dutydata:
