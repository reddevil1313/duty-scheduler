services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duty
      POSTGRES_PASSWORD: duty_local_dev
      POSTGRES_DB: duty
    ports: ["5432:5432"]
    volumes: [dutydata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duty"]
      interval: 5s
      retries: 10
volumes:
  dutydata: